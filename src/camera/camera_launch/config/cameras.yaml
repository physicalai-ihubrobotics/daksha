
# cameras.yaml
#
# Which RealSense cameras start_all_cameras.launch.py actually brings up,
# and with what stream settings -- edit this file instead of the launch
# file to add/remove a camera, change its resolution/fps, or flip a stream
# on/off. Every setting is per-camera, so each one can be tuned independently.
#
# Set a camera's `enabled` to false to skip launching it entirely (e.g. it's
# unplugged, being serviced, or you just want to test the others alone)
# without touching any Python.
#
# color_fps/depth_fps are the Hz knob -- edit just the number, the launch
# file builds the "<res>x<fps>" profile string realsense2_camera expects.
# Not every resolution/fps combination is valid on every RealSense sensor;
# check `rs-enumerate-devices -c` for the ones a given camera actually supports.
#
# All three run at 30 fps below. rs-enumerate-devices reported world and
# left on USB 2.1 (bandwidth-limited) and right on USB 3.2 (full speed) --
# if world/left start dropping frames or timing out at 30 fps, that USB 2.1
# link is the likely reason (see the launch file's comment on moving them to
# native USB3 ports), not a setting in this file.
#
# ── Minimal footprint: only .../color/image_raw/compressed ──────────────
# Nothing downstream in this workspace needs anything but the compressed
# color feed, so every camera below is trimmed to just that:
#   enable_depth: false           kills depth/* entirely (image, camera_info,
#                                  metadata) -- depth_to_color extrinsics stays
#                                  published regardless (see below, it's not
#                                  gated by enable_depth)
#   enable_infra1/infra2: false   no raw infrared streams
#   enable_gyro/enable_accel: false
#                                  IMU off -- also needs udev rules this box
#                                  didn't have (see the launch file); flip
#                                  back on only after running
#                                  src/camera/librealsense/scripts/setup_udev_rules.sh
#                                  and replugging
#   pointcloud.enable: false      no /camera/.../points
#   align_depth.enable: false     no depth-aligned-to-color image
#   publish_tf: false             no extra /tf frames
#   color_pub_plugins: [image_transport/raw]
#                                  image_transport advertises raw + compressed
#                                  + compressedDepth + theora for every image
#                                  topic by default; this restricts color to
#                                  just "raw", so compressed/compressedDepth/
#                                  theora are never advertised by the node.
#
# ── Why RAW here and not "compressed" (OpenCV ABI conflict) ─────────────
# This workspace's realsense2_camera is built against OpenCV 4.8.0 (the
# system libopencv-dev), while /opt/ros/jazzy's cv_bridge and
# compressed_image_transport are built against OpenCV 4.5.4d. When the node
# loads its own compressed publisher, BOTH OpenCV cores end up in the one
# realsense process; the mismatched cv::Mat ABI corrupts the frame size and
# the JPEG encoder throws:
#     [CompressedPublisher] OpenCV(4.8.0) alloc.cpp: Failed to allocate
#     275403890790000 bytes (OutOfMemoryError)
# -> every compressed message goes out with an EMPTY payload, so rviz
# (imdecode !buf.empty()) and the operator UIs show blank cameras.
#
# Fix: the node publishes RAW only, and start_all_cameras.launch.py spawns a
# separate `image_transport republish raw compressed` process per camera.
# That republish process never loads librealsense2_camera.so, so it only has
# the clean 4.5.4d OpenCV and encodes correctly -- the downstream
# .../color/image_raw/compressed topic stays exactly the same for consumers.
# (The permanent fix is rebuilding realsense2_camera against 4.5.4d so the
# in-node compressor works again; this avoids the OpenCV downgrade for now.)
#
# What's left per camera after all of the above (confirmed by actually
# launching it): color/image_raw (raw, from the node), color/camera_info,
# color/metadata, extrinsics/depth_to_color, plus color/image_raw/compressed
# from the republish node. camera_info/metadata/extrinsics are unconditional
# publishers in realsense2_camera tied to the device having a depth+color
# pair at all. extrinsics/depth_to_color is a latched/publish-once
# calibration topic (near-zero ongoing cost).

# ── Depth (enabled) ─────────────────────────────────────────────────────
# enable_depth + align_depth.enable publish, per camera:
#   <ns>/<name>/depth/image_rect_raw                 (16UC1, mm, depth sensor frame)
#   <ns>/<name>/aligned_depth_to_color/image_raw     (16UC1, mm, pixel-aligned with color)
#   + their camera_info
# The pick pipeline (ros_agent) uses aligned_depth_to_color. depth_pub_plugins
# keeps the depth topics RAW only, for the same OpenCV ABI reason as color
# (compressedDepth would load OpenCV inside the realsense process).
# Enabled on the wrist cameras (right, left). NOT on world: its USB 2.1 link cannot carry
# color + depth (color drops to 5-6 fps). Measured live (camera_info rates): left color 29 fps
# + aligned depth 25 fps; right 10 fps both (its D405 color profile is 848x480x10, set by
# depth_module.color_profile -- the rgb_camera.color_profile this launch sets does not apply to D405).

cameras:
  world:
    enabled: true
    namespace: camera
    name: world
    serial_no: "_254922302877"
    color_resolution: "640x480"
    color_fps: 30
    depth_resolution: "640x480"
    depth_fps: 15
    # depth OFF: on USB 2.1 color 30 fps + depth starves color (measured: 5-6 fps with
    # 640x480x15 or 480x270x15 depth). Move the D455 to a USB 3 port, then set these true.
    enable_depth: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    pointcloud.enable: false
    align_depth.enable: false
    publish_tf: false
    color_pub_plugins: [image_transport/raw]
    depth_pub_plugins: [image_transport/raw]

  right:
    enabled: true
    namespace: right
    name: camera
    # Swapped with `left`'s serial below: the physical camera mounted on the
    # right wrist was reporting as "left" (and vice versa) -- the namespace
    # here is what defines "right" for every topic/consumer, so pointing it
    # at the correct physical device is the fix, not renaming the blocks.
    serial_no: "_261122274422"
    color_resolution: "640x480"
    color_fps: 30
    depth_resolution: "640x480"
    depth_fps: 30
    enable_depth: true
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    pointcloud.enable: false
    align_depth.enable: true
    publish_tf: false
    color_pub_plugins: [image_transport/raw]
    depth_pub_plugins: [image_transport/raw]

  left:
    enabled: true
    namespace: left
    name: camera
    # Swapped with `right`'s serial above -- see that comment.
    serial_no: "_261122273397"
    color_resolution: "640x480"
    color_fps: 30
    depth_resolution: "640x480"
    depth_fps: 30
    enable_depth: true
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    pointcloud.enable: false
    align_depth.enable: true
    publish_tf: false
    color_pub_plugins: [image_transport/raw]
    depth_pub_plugins: [image_transport/raw]
