# ============================================================================
# Daksha VLA UI — environment definition (same method as lerobot/pyproject.toml)
#
# Code and environment are kept separate:
#   * code        -> this folder (app.py, ui/) and ./lerobot  (edit freely, no reinstall)
#   * environment -> ~/uni/daksha/robot_venv, shared with all robot packages
#
# Build/rebuild the environment with:   bash ~/uni/daksha/setup_env.sh
#
# What goes where:
#   * lerobot's own deps (torch, numpy, datasets, transformers, ...) are declared in
#     lerobot/pyproject.toml — do NOT repeat them here; pick lerobot extras in
#     ~/uni/daksha/pyproject.toml (the lerobot[...] line) instead.
#   * torch/torchvision/torchcodec come from the PyTorch cu130 index (Jetson Thor,
#     CUDA 13) — pinned in ~/uni/daksha/pyproject.toml, not here.
#   * rclpy / sensor_msgs / std_msgs come from ROS 2 Jazzy (/opt/ros/jazzy, apt);
#     the venv sees them via --system-site-packages.
#   * Only the UI's OWN extra libraries are listed below.
#
# Versions: write ranges here (">=X,<Y"). Exact versions are recorded in
# ~/uni/daksha/uv.lock: after a change run  bash ~/uni/daksha/setup_env.sh --upgrade
# and commit uv.lock.
# ============================================================================

[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "daksha-vla-ui"
version = "0.1.0"
description = "Daksha VLA training & inference web UI on top of LeRobot"
requires-python = ">=3.12"    # ROS 2 Jazzy and lerobot both use Python 3.12
dependencies = [
    # ---- Web UI (Flask) ----
    "Flask>=3.1,<4.0",
    "flask-cors>=6.0,<7.0",
    "Werkzeug>=3.1,<4.0",
    # ---- Dataset-validator API (FastAPI) ----
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.0,<3.0",
    # ---- Inference transport (ZMQ policy server <-> ROS bridge) ----
    "pyzmq>=26.2,<28.0",
    "msgpack>=1.0,<2.0",
    "jsonlines>=4.0,<5.0",
    # ---- Misc used by app.py / ui tools ----
    "psutil>=5.9,<8.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.1,<10.0"]

# app.py is a single top-level module; ui/ is run as scripts by app.py, not imported
# as a package, so nothing else needs to be packaged.
[tool.setuptools]
py-modules = ["app"]
packages = []
